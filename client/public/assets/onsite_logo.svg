<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Onsite Fleet and Auto Care</title>
  <desc id="desc">White Onsite wordmark with deep navy outline and official yellow Fleet and Auto Care accent</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D76D"/>
      <stop offset="0.5" stop-color="#EFC02E"/>
      <stop offset="1" stop-color="#D7A915"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#1A1A1A" flood-opacity="0.68"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(450 150) rotate(-2) skewX(-5) translate(-450 -150)">
      <text x="450" y="215" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="224" font-weight="900" fill="#FFFFFF" stroke="#002549" stroke-width="26" paint-order="stroke">ONSITE</text>
      <text x="450" y="215" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="224" font-weight="900" fill="#FFFFFF" stroke="#123A60" stroke-width="10" paint-order="stroke">ONSITE</text>
    </g>
    <path d="M92 245 C278 205 625 205 808 244 C630 232 278 234 92 272 Z" fill="url(#yellow)" stroke="#002549" stroke-width="18"/>
    <path d="M118 301 C285 287 616 287 784 301 L764 356 C592 338 309 338 138 356 Z" fill="#002549" stroke="#002549" stroke-width="12"/>
    <text x="450" y="341" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" font-weight="900" letter-spacing="2" fill="#EFC02E" stroke="#002549" stroke-width="8" paint-order="stroke">FLEET &amp; AUTO CARE</text>
  </g>
</svg>